{% extends "base.html" %}

{% block baslik %}Kayıt Ol - Dondurmacı Abdülkerim{% endblock %}

{% block icerik %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-body p-4 p-md-5">
                <h3 class="mb-4 text-center">Kayıt Ol</h3>

                {% if hata %}
                    <div class="alert alert-danger">{{ hata }}</div>
                {% endif %}

                <form method="post" action="/kayit-sayfasi">
                    <div class="mb-3">
                        <label class="form-label">Ad Soyad</label>
                        <input type="text" name="ad_soyad" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">E-posta</label>
                        <input type="email" name="email" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Şifre</label>
                        <input type="password" name="sifre" class="form-control" required minlength="6">
                    </div>
                    <div class="mb-3 form-check">
                        <input type="checkbox" name="kampanya_aboneligi" class="form-check-input" value="true" checked>
                        <label class="form-check-label">Yeni ürün ve kampanyalardan haberdar olmak istiyorum</label>
                    </div>
                    <button type="submit" class="btn btn-tatli w-100">Kayıt Ol</button>
                </form>

                <p class="text-center text-muted mt-4 mb-0">
                    Zaten hesabın var mı? <a href="/giris-sayfasi">Giriş Yap</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
